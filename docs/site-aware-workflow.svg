<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Site-aware warfarin model evaluation workflow</title>
  <desc id="description">A six-step workflow arranged in two rows. Public data is audited, one clinical site is held out, the model is trained on the other sites, evaluated once on the held-out site, and the process repeats across all sites.</desc>
  <style>
    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .title { fill: #0f172a; font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .subtitle { fill: #475569; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .number { fill: #ffffff; font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .arrow { fill: none; stroke: #64748b; stroke-linecap: round; stroke-width: 3; }
    .arrowhead { fill: #64748b; }

    @media (prefers-color-scheme: dark) {
      .card { fill: #161b22; stroke: #3d444d; }
      .title { fill: #f0f6fc; }
      .subtitle { fill: #9da7b3; }
      .arrow { stroke: #8b949e; }
      .arrowhead { fill: #8b949e; }
    }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path class="arrowhead" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <!-- Top row -->
  <g>
    <rect class="card" x="40" y="40" width="320" height="130" rx="16"/>
    <rect x="40" y="40" width="7" height="130" rx="3.5" fill="#0ea5e9"/>
    <circle cx="76" cy="78" r="17" fill="#0ea5e9"/>
    <text class="number" x="76" y="78">1</text>
    <text class="title" x="105" y="84">Public IWPC data</text>
    <text class="subtitle" x="70" y="125">5,410 eligible patients · 21 sites</text>
  </g>

  <g>
    <rect class="card" x="440" y="40" width="320" height="130" rx="16"/>
    <rect x="440" y="40" width="7" height="130" rx="3.5" fill="#f59e0b"/>
    <circle cx="476" cy="78" r="17" fill="#f59e0b"/>
    <text class="number" x="476" y="78">2</text>
    <text class="title" x="505" y="84">Eligibility &amp; leakage audit</text>
    <text class="subtitle" x="470" y="120">Verify target, site, predictors,</text>
    <text class="subtitle" x="470" y="143">and forbidden fields</text>
  </g>

  <g>
    <rect class="card" x="840" y="40" width="320" height="130" rx="16"/>
    <rect x="840" y="40" width="7" height="130" rx="3.5" fill="#6366f1"/>
    <circle cx="876" cy="78" r="17" fill="#6366f1"/>
    <text class="number" x="876" y="78">3</text>
    <text class="title" x="905" y="84">Hold out one clinical site</text>
    <text class="subtitle" x="870" y="120">No patients from this site</text>
    <text class="subtitle" x="870" y="143">enter training or selection</text>
  </g>

  <!-- Bottom row, read right to left -->
  <g>
    <rect class="card" x="840" y="330" width="320" height="130" rx="16"/>
    <rect x="840" y="330" width="7" height="130" rx="3.5" fill="#8b5cf6"/>
    <circle cx="876" cy="368" r="17" fill="#8b5cf6"/>
    <text class="number" x="876" y="368">4</text>
    <text class="title" x="905" y="374">Train, select &amp; calibrate</text>
    <text class="subtitle" x="870" y="410">Use only patients from the</text>
    <text class="subtitle" x="870" y="433">remaining clinical sites</text>
  </g>

  <g>
    <rect class="card" x="440" y="330" width="320" height="130" rx="16"/>
    <rect x="440" y="330" width="7" height="130" rx="3.5" fill="#10b981"/>
    <circle cx="476" cy="368" r="17" fill="#10b981"/>
    <text class="number" x="476" y="368">5</text>
    <text class="title" x="505" y="374">Evaluate once</text>
    <text class="subtitle" x="470" y="410">Generate predictions only for</text>
    <text class="subtitle" x="470" y="433">the held-out clinical site</text>
  </g>

  <g>
    <rect class="card" x="40" y="330" width="320" height="130" rx="16"/>
    <rect x="40" y="330" width="7" height="130" rx="3.5" fill="#f97316"/>
    <circle cx="76" cy="368" r="17" fill="#f97316"/>
    <text class="number" x="76" y="368">6</text>
    <text class="title" x="105" y="374">Repeat &amp; aggregate</text>
    <text class="subtitle" x="70" y="410">Combine out-of-site evidence</text>
    <text class="subtitle" x="70" y="433">across all 21 sites</text>
  </g>

  <!-- Snake-shaped flow -->
  <path class="arrow" marker-end="url(#arrow)" d="M 370 105 H 428"/>
  <path class="arrow" marker-end="url(#arrow)" d="M 770 105 H 828"/>
  <path class="arrow" marker-end="url(#arrow)" d="M 1000 182 V 318"/>
  <path class="arrow" marker-end="url(#arrow)" d="M 830 395 H 772"/>
  <path class="arrow" marker-end="url(#arrow)" d="M 430 395 H 372"/>
</svg>
